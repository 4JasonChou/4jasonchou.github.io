<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUKUOKA 2D — 福岡兩日 Trip Site</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f5f2ec;--card:#fff;--ink:#1f2523;--muted:#747873;--accent:#d95f43;--line:#e8e2d8;--dark:#202622}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC",system-ui,sans-serif}
header{padding:28px 22px 18px;max-width:1180px;margin:auto}h1{margin:0;font-size:32px;letter-spacing:-1px}.sub{color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:8px;margin-top:20px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700}.tab.active{background:var(--dark);color:#fff}
.wrap{max-width:1180px;margin:auto;padding:0 22px 32px;display:grid;grid-template-columns:390px 1fr;gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 30px #00000008}
.timeline{display:grid;gap:12px}.item{padding:14px;border:1px solid var(--line);border-radius:15px;cursor:pointer}.item:hover{border-color:#c9bfb0}.time{font-size:12px;color:var(--accent);font-weight:800}.title{font-size:17px;font-weight:800;margin:4px 0}.note{font-size:13px;color:var(--muted);line-height:1.55}
.badge{display:inline-block;font-size:11px;background:#f0ece5;padding:4px 8px;border-radius:999px;margin-top:6px}.transport{background:#edf3ef}.dinner{background:#fff0ec}
#map{height:660px;border-radius:16px;overflow:hidden}.maptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.maptop b{font-size:18px}
.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--dark);color:#fff;cursor:pointer}.btn.secondary{background:#eee9e0;color:var(--ink)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions a{font-size:12px;text-decoration:none;color:var(--ink);background:#f1ede6;padding:7px 9px;border-radius:9px}
.info{margin-top:14px;padding:12px;background:#f8f5ef;border-radius:12px;font-size:12px;line-height:1.55}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.legend span{font-size:11px;padding:5px 8px;border-radius:999px;background:#f0ece5}
@media(max-width:850px){.wrap{grid-template-columns:1fr}.panel.mapPanel{order:-1}#map{height:430px}header{padding-top:20px}}
</style>
</head>
<body>
<header>
  <h1>FUKUOKA 2D</h1>
  <div class="sub">兩天一夜？不是。這次是「兩天快閃」：吃、逛、地鐵、機場。</div>
  <div class="tabs">
    <button class="tab active" data-day="d1">DAY 01 · 天神</button>
    <button class="tab" data-day="d2">DAY 02 · 博多</button>
  </div>
</header>

<main class="wrap">
<section class="panel">
  <div id="summary"></div>
  <div class="timeline" id="timeline"></div>
  <div class="info"><b>🚇 交通規則</b><br>本行程只排福岡市地下鐵／步行，不安排公車。Suica 不作為必要條件；現場可依你的實際票卡／購票方式搭乘。出發前再確認當日票價與營運資訊。</div>
  <div class="info"><b>📍 自訂 Pin</b><br>點地圖上的「＋ Pin」，輸入名稱即可加入個人想去的地方；資料會存在瀏覽器 LocalStorage。</div>
</section>

<section class="panel mapPanel">
  <div class="maptop"><b id="mapTitle">DAY 01 · 天神</b><button class="btn" id="addPin">＋ Pin</button></div>
  <div class="legend"><span>🍴 餐廳</span><span>🏨 飯店</span><span>🚇 地鐵</span><span>🛍️ 逛街</span><span>✦ 自訂</span></div>
  <div id="map"></div>
</section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const days={
 d1:{
  title:"DAY 01 · 天神",
  summary:"DACOMECCA 午餐 → 天神散步／購物 → 20:00 一藤",
  center:[33.5898,130.3977], zoom:15,
  items:[
   ["11:30","🍞 DACOMECCA","午餐／博多站附近","餐廳","〒812-0011 福岡県福岡市博多区博多駅前4丁目14"],
   ["13:00","🚇 博多 → 天神","福岡市地下鐵・空港線方向","交通","地鐵移動；不排公車"],
   ["13:30","🛍️ 天神散步","天神地下街・西通り・大名一帶","逛街","可依體力自由調整"],
   ["17:30","☕ 天神 Cafe Time","大名／今泉一帶","休息","晚餐前休息"],
   ["20:00","🍲 もつ鍋 一藤 天神西通り店","晚餐・已指定 20:00","晚餐","福岡市中央区大名2-6-4 プラスゲート天神ビル2F/3F"]
  ],
  pins:[
   ["DACOMECCA",33.5857,130.4164,"🍞"],
   ["天神地下街",33.5909,130.3986,"🛍️"],
   ["福岡PARCO",33.5902,130.3974,"🛍️"],
   ["大名",33.5882,130.3947,"🛍️"],
   ["一藤 天神西通り店",33.5905,130.3940,"🍲"]
  ]
 },
 d2:{
  title:"DAY 02 · 博多",
  summary:"飯店 → 極味や 博多駅地下街店 → Hakata Station Area → 17:00 前往機場",
  center:[33.5890,130.4207], zoom:16,
  items:[
   ["09:00","🏨 飯店早餐／整理行李","退房後寄放行李","飯店","行李安排依飯店規定"],
   ["11:30","🍖 極味や 博多駅地下街店","午餐・你指定的分店","餐廳","福岡市博多区博多駅中央街1-1 博多駅地下街 C20号"],
   ["13:00","🛍️ JR Hakata City","博多站周邊逛街","逛街","AMU PLAZA／Hakata Hankyu 等"],
   ["14:30","🛍️ KITTE Hakata / Yodobashi","購物／休息","逛街","都集中在博多站周邊"],
   ["16:15","🎒 回博多站取行李","準備去機場","交通","建議不要把最後時間壓太緊"],
   ["17:00","🚇 博多 → 福岡空港","福岡市地下鐵・空港線","交通","直接搭地下鐵前往福岡空港"]
  ],
  pins:[
   ["極味や 博多駅地下街店",33.5890,130.4200,"🍖"],
   ["JR Hakata City",33.5899,130.4205,"🛍️"],
   ["AMU PLAZA Hakata",33.5897,130.4207,"🛍️"],
   ["Hakata Hankyu",33.5897,130.4217,"🛍️"],
   ["KITTE Hakata",33.5892,130.4200,"🛍️"],
   ["Yodobashi Hakata",33.5890,130.4257,"🛍️"]
  ]
 }
};

let day="d1", map, markers=[], routeLayer;
const $=id=>document.getElementById(id);

function initMap(){
 map=L.map("map").setView(days[day].center,days[day].zoom);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 renderDay();
}
function clearMap(){markers.forEach(m=>map.removeLayer(m));markers=[]; if(routeLayer){map.removeLayer(routeLayer);routeLayer=null;}}
function addMarker(name,lat,lng,emoji,custom=false){
 const m=L.marker([lat,lng]).addTo(map);
 m.bindPopup(`<b>${emoji} ${name}</b><br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}">Google Maps</a>`);
 markers.push(m);
}
function renderDay(){
 clearMap(); const d=days[day];
 $("summary").innerHTML=`<div style="font-size:13px;color:#8a8278">福岡 2 DAY QUICK TRIP</div><h2 style="margin:4px 0 8px">${d.summary}</h2>`;
 $("mapTitle").textContent=d.title;
 $("timeline").innerHTML=d.items.map((x,i)=>`<div class="item" data-i="${i}"><div class="time">${x[0]}</div><div class="title">${x[1]}</div><div class="note">${x[2]}</div><span class="badge">${x[3]}</span><div class="actions"><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x[4])}">Google Maps</a></div></div>`).join("");
 d.pins.forEach(p=>addMarker(p[0],p[1],p[2],p[3]));
 // approximate walking/subway visualization only between key area pins
 if(day==="d1") routeLayer=L.polyline([[33.5857,130.4164],[33.5909,130.3986],[33.5905,130.3940]],{dashArray:"7 8"}).addTo(map);
 if(day==="d2") routeLayer=L.polyline([[33.5890,130.4200],[33.5899,130.4205],[33.5890,130.4257]],{dashArray:"7 8"}).addTo(map);
 document.querySelectorAll(".item").forEach(el=>el.onclick=()=>{let i=+el.dataset.i;let x=d.items[i];map.openPopup(L.popup().setLatLng(d.center).setContent(`<b>${x[1]}</b><br>${x[4]}`));});
 map.setView(d.center,d.zoom);
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{day=b.dataset.day;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderDay();});
$("addPin").onclick=()=>{
 const name=prompt("這個 Pin 叫什麼？"); if(!name)return;
 const c=map.getCenter(); addMarker(name,c.lat,c.lng,"✦",true);
 const saved=JSON.parse(localStorage.getItem("fukuoka-custom-pins")||"[]");
 saved.push({day,name,lat:c.lat,lng:c.lng}); localStorage.setItem("fukuoka-custom-pins",JSON.stringify(saved));
};
initMap();
</script>
</body></html>
